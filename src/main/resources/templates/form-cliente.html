<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro/Alteração de Cliente</title>
</head>
<body>
    <h1 th:text="${cliente.idCliente != null ? 'Editar Cliente' : 'Cadastrar Novo Cliente'}"></h1>

    <form th:action="@{/clientes/save}" th:object="${cliente}" method="post">
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" th:field="*{cpf}" required/><br/>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}" required/><br/>

        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required/><br/>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" th:field="*{senha}" required/><br/>

        <label for="cnh">CNH:</label>
        <input type="text" id="cnh" th:field="*{cnh}" required/><br/>

        <label for="dataNascimento">Data de Nascimento:</label>
        <input type="date" id="dataNascimento" th:field="*{dataNascimento}" required/><br/>

        <button type="submit">Salvar</button>
    </form>
    <br/>
    <a href="/clientes">Voltar para a lista</a>
</body>
</html>
