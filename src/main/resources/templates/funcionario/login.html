<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Funcionário - Voce Aluga</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Login do Funcionário</h1>
        </div>

        <div th:if="${erro}" class="alert alert-danger">
            <p th:text="${erro}"></p>
        </div>

        <form th:action="@{/funcionario/login}" th:object="${funcionario}" method="post">
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" th:field="*{senha}" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <p>Voltar para o login do cliente? <a th:href="@{/cliente/login}">Clique aqui</a></p>
    </div>
</body>
</html>
