<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Funcionário - Você Aluga</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <div class="login-container">
        <h1>Você Aluga</h1>

        <div th:if="${erro}" class="erro">
            <p th:text="${erro}"></p>
        </div>

        <form th:action="@{/funcionario/login}" th:object="${funcionario}" method="post">
            <input type="email" th:field="*{email}" placeholder="E-mail" required>
            <input type="password" th:field="*{senha}" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>

        <p>Voltar para o login do cliente? <a th:href="@{/cliente/login}">Clique aqui</a></p>
    </div>
</body>
</html>
