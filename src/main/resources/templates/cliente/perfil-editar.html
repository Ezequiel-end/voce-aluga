<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Você Aluga</title>
    <!-- <link rel="stylesheet" th:href="@{/css/editar.css}"> -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container">
        
        <!-- Sidebar Menu -->
        <aside class="sidebar">
            <h2 class="menu-title">Você Aluga</h2>

            <nav>
                <ul>
                    <li class="menu-item"><a th:href="@{/cliente/dashboard}">Dashboard</a></li>
                    <li class="menu-item"><a th:href="@{/cliente/reservas}">Minhas Reservas</a></li>
                    <li class="menu-item"><a th:href="@{/cliente/perfil/editar}">Editar Perfil</a></li>
                    <li class="menu-item"><a th:href="@{/cliente/logout}">Sair</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <div class="main-content">
            <header>
                <h1>
                    <span>Editar Perfil</span>
                </h1>
            </header>

            <!-- Feedback Messages -->
            <div class="messages">
                <p th:if="${success}" class="success-message" th:text="${success}"></p>
                <p th:if="${error}" class="error-message" th:text="${error}"></p>
            </div>

            <!-- Content Area -->
            <section id="content-area">
                <div class="form-container">

                    <form th:action="@{/cliente/perfil/editar}" th:object="${cliente}" method="post">
                        <input type="hidden" th:field="*{idCliente}">

                        <div class="form-group">
                            <label for="nome">Nome Completo:</label>
                            <input type="text" id="nome" th:field="*{nome}" required>
                        </div>

                        <div class="form-group">
                            <label for="email">E-mail:</label>
                            <input type="email" id="email" th:field="*{email}" required>
                        </div>

                        <div class="form-group">
                            <label for="senha">Senha:</label>
                            <input type="password" id="senha" th:field="*{senha}" placeholder="Deixe em branco para não alterar a senha">
                        </div>

                        <button type="submit" class="btn btn-primary">Atualizar Perfil</button>
                    </form>

                </div>
            </section>
        </div>
    </div>
</body>
</html>
