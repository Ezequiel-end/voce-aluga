<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Você Aluga</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <div class="login-container">
        <h1>Você Aluga</h1>

         <div th:if="${error}" class="erro">
                <p th:text="${error}"></p>
        </div>

        <div th:if="${success}" class="sucesso">
            <p th:text="${success}"></p>
        </div>

        <form th:action="@{/cliente/login}" th:object="${cliente}" method="post">

            <input type="email" th:field="*{email}" placeholder="E-mail" required>
            <input type="password" th:field="*{senha}" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>

        <p>Não tem uma conta? <a th:href="@{/cliente/cadastro}">Cadastre-se aqui</a>.</p>
    </div>
</body>
</html>
