<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Reserva - Voce Aluga</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/telaCliente.css}">
</head>
<body>
    <div class="container">
        <!-- Sidebar Menu -->
        <aside class="sidebar">
            <h2 class="menu-title">Você Aluga</h2>

            <nav>
                <ul>
                    <li class="menu-item"><a th:href="@{/cliente/dashboard}">Dashboard</a></li>
                    <li class="menu-item"><a th:href="@{/cliente/reservas}">Minhas Reservas</a></li>
                    <li class="menu-item"><a th:href="@{/cliente/perfil/editar}">Editar Perfil</a></li>
                    <li class="menu-item"><a th:href="@{/cliente/logout}">Sair</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <div class="main-content">
            <header>
                <h1>
                    <span>Fazer Nova Reserva</span>
                </h1>
            </header>

            <!-- Feedback Messages -->
            <div class="messages">
                <p th:if="${success}" class="success-message" th:text="${success}"></p>
                <p th:if="${error}" class="error-message" th:text="${error}"></p>
            </div>

            <!-- Content Area -->
            <section id="content-area">
                <div class="form-container">
                    <h2>Criar Nova Reserva</h2>

                    <form th:action="@{/cliente/reservas/nova}" th:object="${reserva}" method="post">
                        <div class="form-group">
                            <label for="filial">Filial para Retirada:</label>
                            <select id="filial" th:field="*{filial.idFilial}" required>
                                <option value="">Selecione uma Filial</option>
                                <option th:each="filial : ${filiais}" th:value="${filial.idFilial}" th:text="${filial.nome}"></option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="veiculo">Veículo:</label>
                            <select id="veiculo" th:field="*{veiculo.idVeiculo}" required>
                                <option value="">Selecione um Veículo</option>
                                <!-- As opções serão preenchidas via JavaScript -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="dataInicio">Data e Hora de Início:</label>
                            <input type="datetime-local" id="dataInicio" th:field="*{dataInicio}" required>
                        </div>

                        <div class="form-group">
                            <label for="dataFim">Data e Hora de Fim:</label>
                            <input type="datetime-local" id="dataFim" th:field="*{dataFim}" required>
                        </div>

                        <div class="form-group">
                            <label for="valor">Valor Estimado:</label>
                            <input type="number" id="valor" th:field="*{valor}" step="0.01" readonly required placeholder="Calculado após a seleção de datas/veículo">
                        </div>

                        <button type="submit" class="btn btn-primary">Criar Reserva</button>
                    </form>
                </div>
            </section>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        // Atualiza o campo de veículos ao selecionar uma filial
        document.getElementById('filial').addEventListener('change', function() {
            const filialId = this.value;
            const veiculoSelect = document.getElementById('veiculo');
            // Limpa as opções atuais
            veiculoSelect.innerHTML = '<option value="">Selecione um Veículo</option>';
            if (filialId) {
                fetch(`/cliente/veiculos-por-filial?filialId=${filialId}`)
                    .then(response => response.json())
                    .then(veiculos => {
                        veiculos.forEach(veiculo => {
                            const option = document.createElement('option');
                            option.value = veiculo.idVeiculo;
                            option.textContent = `${veiculo.modelo} (${veiculo.placa}) - Grupo: ${veiculo.grupoVeiculo ? veiculo.grupoVeiculo.grupo : 'N/A'}`;
                            veiculoSelect.appendChild(option);
                        });
                    });
            }
        });

        // Mantém apenas a lógica de cálculo de valor estimado
        const dataInicioInput = document.getElementById('dataInicio');
        const dataFimInput = document.getElementById('dataFim');
        const valorInput = document.getElementById('valor');

        function calculateEstimatedValue() {
            const dataInicio = dataInicioInput.value;
            const dataFim = dataFimInput.value;

            if (dataInicio && dataFim) {
                const start = new Date(dataInicio);
                const end = new Date(dataFim);

                // Diferença em milissegundos
                const diffTime = Math.abs(end.getTime() - start.getTime());
                // Diferença em dias (considerando horas para uma contagem mais precisa se necessário)
                // Se a diferença for menor que 24 horas, ainda conta como 1 dia de aluguel.
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                // Exemplo de cálculo: 100 por dia (ajuste sua lógica de preço real aqui)
                const valorCalculado = diffDays > 0 ? (diffDays * 100).toFixed(2) : (1 * 100).toFixed(2); // Mínimo de 1 dia
                valorInput.value = valorCalculado;
            } else {
                valorInput.value = '';
            }
        }

        dataInicioInput.addEventListener('change', calculateEstimatedValue);
        dataFimInput.addEventListener('change', calculateEstimatedValue);

        // Inicializa o cálculo ao carregar a página
        document.addEventListener('DOMContentLoaded', () => {
            calculateEstimatedValue(); // Calcula o valor inicial se as datas já estiverem preenchidas
        });
        /*]]>*/
    </script>
</body>
</html>
