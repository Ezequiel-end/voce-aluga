<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Cliente - Você Aluga</title>
  <link rel="stylesheet" th:href="@{/css/cadastroCliente.css}">
</head>
<body>
  <div class="cadastro-container">
    <h1>Cadastro</h1>

    <div th:if="${errorMessage}" class="mensagem erro">
        <p th:text="${errorMessage}"></p>
    </div>
    <div th:if="${successMessage}" class="mensagem sucesso">
         <p th:text="${successMessage}"></p>
    </div>

    <form th:action="@{/cliente/cadastro}" th:object="${cliente}" method="post">
      <input type="text" placeholder="Nome completo" th:field="*{nome}" required />
      <input type="email" placeholder="E-mail" th:field="*{email}" required />
      <input type="password" placeholder="Senha" th:field="*{senha}" required />
      <input type="text" placeholder="CPF" th:field="*{cpf}" required />
      <input type="text" placeholder="CNH" th:field="*{cnh}" required />
      <input type="date" th:field="*{dataNascimento}" required />
      <button type="submit">Cadastrar</button>
    </form>

    <p>Já tem uma conta? <a th:href="@{/cliente/login}">Entrar</a></p>
  </div>
</body>
</html>
