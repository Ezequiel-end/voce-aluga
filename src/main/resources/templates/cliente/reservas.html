<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Reservas - Voce Aluga</title>
    <link rel="stylesheet" th:href="@{/css/telaCliente.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <!-- Sidebar Menu -->
        <aside class="sidebar">
            <h2 class="menu-title">Você Aluga</h2>

            <nav>
                <ul>
                    <li class="menu-item"><a th:href="@{/cliente/dashboard}">Dashboard</a></li>
                    <li class="menu-item"><a th:href="@{/cliente/reservas}">Minhas Reservas</a></li>
                    <li class="menu-item"><a th:href="@{/cliente/perfil/editar}">Editar Perfil</a></li>
                    <li class="menu-item"><a th:href="@{/cliente/logout}">Sair</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <div class="main-content">
            <header>
                <h1>
                    <span>Minhas reservas</span>
                </h1>
            </header>

            <!-- Feedback Messages -->
            <div class="messages">
                <p th:if="${success}" class="success-message" th:text="${success}"></p>
                <p th:if="${error}" class="error-message" th:text="${error}"></p>
            </div>

            <!-- Content Area -->
            <section id="content-area">
                <div class="content-display">
                    <div class="content-display-header">
                        <h2>Suas reservas</h2>
                        <p><a th:href="@{/cliente/reservas/nova}" class="button">Fazer Nova Reserva</a></p>
                    </div>
                    
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID da Reserva</th>
                                <th>Veículo</th>
                                <th>Filial</th>
                                <th>Data Início</th>
                                <th>Data Fim</th>
                                <th>Valor</th>
                                <th>Status</th>
                                <!-- <th>Ações</th> -->
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="reserva : ${reservas}">
                                <td th:text="${reserva.idReserva}"></td>
                                <td th:text="${reserva.veiculo.modelo} + ' (' + ${reserva.veiculo.placa} + ')'"></td>
                                <td th:text="${reserva.filial.nome}"></td>
                                <td th:text="${#temporals.format(reserva.dataInicio, 'dd/MM/yyyy')}"></td>
                                <td th:text="${#temporals.format(reserva.dataFim, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${#numbers.formatCurrency(reserva.valor)}"></td>
                                <td th:text="${reserva.status}"></td>

                                <!-- <td class="actions">
                                    <a th:if="${reserva.status == 'PENDENTE'}" th:href="@{/cliente/reservas/{id}/pagar(id=${reserva.idReserva})}" class="button">Pagar</a>
                                    <form th:if="${reserva.status == 'PENDENTE' || reserva.status == 'CONFIRMADA'}" th:action="@{/cliente/reservas/cancelar/{id}(id=${reserva.idReserva})}" method="post" style="display:inline;">
                                        <button type="submit" onclick="return confirm('Tem certeza que deseja cancelar esta reserva?');">Cancelar</button>
                                    </form>
                                    <span th:if="${reserva.status == 'PAGA' || reserva.status == 'CONCLUIDA' || reserva.status == 'CANCELADA_CLIENTE' || reserva.status == 'CANCELADA_ADM'}">N/A</span>
                                </td> -->
                            </tr>

                            <tr th:if="${#lists.isEmpty(reservas)}">
                                <td colspan="8">Nenhuma reserva encontrada.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
