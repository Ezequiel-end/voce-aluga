<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="registerFilialForm">
    <div class="form-container">
        <h2>Cadastrar Nova Filial</h2>
        <form th:action="@{/funcionario/cadastrar-filial}" th:object="${filial}" method="post">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" th:field="*{nome}" required />
            </div>
            <div class="form-group">
                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" th:field="*{endereco}" required />
            </div>
            <div class="form-group">
                <label for="capacidade">Capacidade:</label>
                <input type="number" id="capacidade" th:field="*{capacidade}" min="1" required />
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">Cadastrar</button>
            </div>
        </form>
    </div>
</body>
</html>
