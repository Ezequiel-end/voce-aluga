<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="createReservaForm">
    <div class="form-container">
        <h2>Criar Nova Reserva</h2>
        <form th:action="@{/funcionario/reservas/criar-reserva}" th:object="${reserva}" method="post" id="reservaForm">
            
            <!-- Filial -->
            <div class="form-group">
                <label for="filialReserva">Filial:</label>
                <select id="filialReserva" name="filialId" required onchange="submitFilialChange()">
                    <option value="">Selecione uma Filial</option>
                    <option th:each="filial : ${filiais}" 
                            th:value="${filial.idFilial}" 
                            th:text="${filial.nome}"
                            th:selected="${filial.idFilial == selectedFilialId}"></option>
                </select>
            </div>

            <!-- Veículo -->
            <div class="form-group">
                <label for="veiculoReserva">Veículo:</label>
                <select id="veiculoReserva" name="veiculoId" required 
                        th:disabled="${veiculos.size() == 0}">
                    <option value="">Selecione um Veículo</option>
                    <option th:each="veiculo : ${veiculos}" 
                            th:value="${veiculo.idVeiculo}" 
                            th:text="${veiculo.modelo + ' - ' + veiculo.placa + ' (' + veiculo.grupoVeiculo.grupo + ')'}">
                    </option>
                </select>
            </div>

            <!-- Funcionário -->
            <div class="form-group">
                <label for="funcionarioReserva">Funcionário:</label>
                <select id="funcionarioReserva" name="funcionarioId" required>
                    <option value="">Selecione um Funcionário</option>
                    <option th:each="func : ${funcionarios}" 
                            th:value="${func.idFuncionario}" 
                            th:text="${func.nome}"></option>
                </select>
            </div>

            <!-- Cliente 
            <div class="form-group">
                <label for="clienteReserva">Cliente:</label>
                <select id="clienteReserva" name="clienteId" required>
                    <option value="">Selecione um Cliente</option>
                    <option th:each="cliente : ${clientes}" 
                            th:value="${cliente.idCliente}" 
                            th:text="${cliente.nome + ' (' + cliente.cpf + ')'}"></option>
                </select>
            </div>
            -->

            <!-- Cliente (Substituído por campo CPF) -->
            <div class="form-group">
                <label for="clienteCpf">CPF do Cliente:</label>
                <input type="text" id="clienteCpf" name="clienteCpf" placeholder="Digite o CPF" required pattern="\d{11}" title="Digite um CPF válido (11 dígitos)">
            </div>

            <!-- Datas -->
            <div class="form-group">
                <label for="dataInicio">Data de Início:</label>
                <input type="datetime-local" id="dataInicio" th:field="*{dataInicio}" required>
            </div>

            <div class="form-group">
                <label for="dataFim">Data e Hora de Fim:</label>
                <input type="datetime-local" id="dataFim" th:field="*{dataFim}" required>
            </div>

            <!-- Valor -->
            <div class="form-group">
                <label for="valor">Valor:</label>
                <input type="number" id="valor" th:field="*{valor}" step="0.01" readonly required>
            </div>

            <!-- Botão -->
            <button type="submit" class="btn btn-primary">Criar Reserva</button>

        </form>
    </div>

    <!-- Script para trocar o método do form ao mudar a filial e calcular valor -->
    <script>
        function submitFilialChange() {
            const form = document.getElementById('reservaForm');
            form.method = 'get';
            form.submit();
        }

        function calcularValor() {
            const veiculoSelect = document.getElementById('veiculoReserva');
            const dataInicio = document.getElementById('dataInicio');
            const dataFim = document.getElementById('dataFim');
            const valorInput = document.getElementById('valor');

            if (veiculoSelect.value && dataInicio.value && dataFim.value) {
                const veiculoSelecionado = Array.from(veiculoSelect.options)
                    .find(option => option.value === veiculoSelect.value);
                const grupoMatch = veiculoSelecionado ? veiculoSelecionado.text.match(/\((A|B|C)\)/) : null;
                const grupo = grupoMatch ? grupoMatch[1] : null;

                if (grupo) {
                    const taxaPorDia = {
                        'A': 1000,
                        'B': 500,
                        'C': 250
                    }[grupo];

                    const inicio = new Date(dataInicio.value);
                    const fim = new Date(dataFim.value);
                    const diffTempo = fim - inicio;
                    const dias = Math.ceil(diffTempo / (1000 * 60 * 60 * 24)); // Dias inteiros

                    if (dias > 0) {
                        const valorTotal = taxaPorDia * dias;
                        valorInput.value = valorTotal.toFixed(2);
                    } else {
                        valorInput.value = '0.00';
                    }
                } else {
                    valorInput.value = '0.00';
                }
            } else {
                valorInput.value = '0.00';
            }
        }
        document.getElementById('veiculoReserva').addEventListener('change', calcularValor);
        document.getElementById('dataInicio').addEventListener('change', calcularValor);
        document.getElementById('dataFim').addEventListener('change', calcularValor);
    </script>
</body>
</html>
