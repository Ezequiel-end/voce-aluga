<!DOCTYPE html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <meta charset="UTF-8" />
    <title>Login - Você Aluga</title>
    <link
      rel="stylesheet"
      th:href="@{/css/login.css}"
    />

    <!-- Fontes -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="login-container">
      <h1>Você Aluga</h1>

      <form
        th:action="@{/login}"
        method="post"
        class="loginForm"
      >
        <input
          type="email"
          name="email"
          placeholder="E-mail"
          class="input"
          required
        />
        <input
          type="password"
          name="senha"
          placeholder="Senha"
          class="input"
          required
        />
        <button type="submit">Entrar</button>

        <p>
          Não tem uma conta?
          <a th:href="@{/cadastro}">Cadastre-se</a>
        </p>
      </form>

      <div
        th:if="${erro}"
        class="erro"
      >
        <p th:text="${erro}"></p>
      </div>
    </div>
  </body>
</html>
