apiVersion: v1
kind: Service
metadata:
  name: mysql-replica
  namespace: voce-aluga
  labels:
    app: mysql-replica
spec:
  clusterIP: None
  selector:
    app: mysql-replica
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-replica
  namespace: voce-aluga
spec:
  serviceName: mysql-replica
  replicas: 2
  selector:
    matchLabels:
      app: mysql-replica
  template:
    metadata:
      labels:
        app: mysql-replica
    spec:
      initContainers:
        - name: wait-primary
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voce-aluga-db
                  key: password
          command:
            - bash
            - -c
            - |
              until mysql -h mysql-primary-0.mysql-primary.voce-aluga.svc.cluster.local \
                -uroot -p"${MYSQL_ROOT_PASSWORD}" -e "SELECT 1" >/dev/null 2>&1; do
                echo "aguardando mysql-primary-0"; sleep 3;
              done
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voce-aluga-db
                  key: password
            - name: MYSQL_DATABASE
              value: db_voce_aluga
          command:
            - bash
            - -c
            - |
              ORD=${HOSTNAME##*-}
              SID=$((21 + ORD))
              exec docker-entrypoint.sh mysqld --server-id=$SID --relay-log=relay-bin --read-only=1 --gtid-mode=ON --enforce-gtid-consistency=ON
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
