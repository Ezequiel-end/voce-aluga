apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-web
  namespace: voce-aluga
  labels:
    app: api-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-web
  template:
    metadata:
      labels:
        app: api-web
    spec:
      containers:
        - name: api-web
          image: vocealuga/api-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: web
            - name: SERVER_PORT
              value: "8082"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: voce-aluga-db
                  key: url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: voce-aluga-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voce-aluga-db
                  key: password
            - name: API_REST_URL
              value: http://api-rest.voce-aluga.svc.cluster.local:8081
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 3
