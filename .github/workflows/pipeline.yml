name: CI/CD Pipeline — Você Aluga

on:
  push:
    branches: [main, master, trabalho-final-devops]
  pull_request:
    branches: [main, master, trabalho-final-devops]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/vocealuga-api-rest
  IMAGE_WEB: ghcr.io/${{ github.repository }}/vocealuga-api-web
  SONAR_HOST: http://localhost:9000
  GATEWAY_URL: http://localhost:8080

jobs:
  test-api:
    name: Testes API REST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Testes unitarios API REST
        run: chmod +x gradlew && ./gradlew test --tests "com.vocealuga.controller.p_api.*" --tests "com.vocealuga.service.*"

  test-web:
    name: Testes API Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Testes unitarios API Web
        run: chmod +x gradlew && ./gradlew test --tests "com.vocealuga.controller.web.*"

  sonarqube:
    name: Analise SonarQube
    needs: [test-api, test-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Subir SonarQube
        run: |
          docker run -d --name sonarqube -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true sonarqube:community
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/api/system/status | grep -q UP && break
            sleep 5
          done
      - name: Executar testes com cobertura
        run: chmod +x gradlew && ./gradlew test jacocoTestReport
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew sonar \
            -Dsonar.projectKey=voce-aluga \
            -Dsonar.host.url=${{ env.SONAR_HOST }} \
            -Dsonar.token="${SONAR_TOKEN:-admin}"
      - name: Verificar Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PASSWORD: ${{ secrets.SONAR_PASSWORD }}
        run: |
          USER="${SONAR_TOKEN:-admin}"
          PASS="${SONAR_PASSWORD:-admin}"
          sleep 15
          STATUS=$(curl -s -u "${USER}:${PASS}" \
            "${{ env.SONAR_HOST }}/api/qualitygates/project_status?projectKey=voce-aluga" \
            | grep -o '"status":"[^"]*"' | head -1 || true)
          echo "Quality Gate: ${STATUS:-desconhecido}"
          echo "${STATUS}" | grep -q '"status":"OK"' || echo "Quality Gate ainda nao OK (continuando pipeline)"

  sast:
    name: SAST (Trivy + Semgrep)
    needs: [test-api, test-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/default
      - name: Build imagem para scan
        run: docker build -f infra/apis/api-1/Docker/Dockerfile -t vocealuga/api-rest:scan .
      - name: Trivy scan imagem
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vocealuga/api-rest:scan
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

  build-and-push:
    name: Build e Push Docker
    needs: [sonarqube, sast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push API REST
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/apis/api-1/Docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
      - name: Build e push API Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/apis/api-2/Docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}

  deploy-homolog:
    name: Deploy Homologacao
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Gerar chave SSH para Ansible
        run: |
          ssh-keygen -t ed25519 -f infra/ansible/files/voce-aluga -N ""
          chmod 600 infra/ansible/files/voce-aluga

      - name: Instalar dependencias
        run: |
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.26.0/kind-linux-amd64 -o kind && chmod +x kind
          curl -fsSL https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl -o kubectl && chmod +x kubectl
          sudo mv kind kubectl /usr/local/bin/
          pip install ansible

      - name: Build imagens locais
        run: |
          docker build -f infra/apis/api-1/Docker/Dockerfile -t vocealuga/api-rest:${{ github.sha }} .
          docker build -f infra/apis/api-2/Docker/Dockerfile -t vocealuga/api-web:${{ github.sha }} .
          docker tag vocealuga/api-rest:${{ github.sha }} vocealuga/api-rest:latest
          docker tag vocealuga/api-web:${{ github.sha }} vocealuga/api-web:latest

      - name: Subir registry e banco
        run: |
          docker compose -f infra/docker-compose.yml up -d registry rds-mysql localstack
          for i in $(seq 1 30); do
            docker exec voce-aluga-rds-mysql mysqladmin ping -h localhost -uroot -psenha123 && break
            sleep 5
          done

      - name: Publicar imagens no registry privado
        run: |
          docker tag vocealuga/api-rest:latest localhost:5000/vocealuga/api-rest:latest
          docker tag vocealuga/api-web:latest localhost:5000/vocealuga/api-web:latest
          docker push localhost:5000/vocealuga/api-rest:latest
          docker push localhost:5000/vocealuga/api-web:latest

      - name: Subir ambiente local
        run: |
          docker compose -f infra/docker-compose.yml up -d ec2-api gateway api-rest api-web
          sleep 45

      - name: Criar cluster kind
        run: bash infra/scripts/setup-kind.sh

      - name: Carregar imagens no kind
        run: kind load docker-image vocealuga/api-web:${{ github.sha }} --name voce-aluga

      - name: Deploy Docker via Ansible
        run: |
          cd infra/ansible
          ansible-playbook playbooks/deploy-docker.yml \
            -e docker_tag=${{ github.sha }}

      - name: Deploy K8s via Ansible
        run: |
          cd infra/ansible
          ansible-playbook playbooks/deploy-k8s.yml \
            -e docker_image_web=vocealuga/api-web \
            -e docker_tag=${{ github.sha }}

      - name: Aguardar gateway
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 5
          done
          curl -sf http://localhost:8080/cliente/login
          exit 0

      - name: DAST OWASP ZAP baseline no gateway
        continue-on-error: true
        run: |
          docker run --rm --network host -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t ${{ env.GATEWAY_URL }} -m 3 -I

  notify:
    name: Notificacao
    needs: [deploy-homolog]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resumo do pipeline
        run: |
          if [ "${{ needs.deploy-homolog.result }}" = "success" ]; then
            echo "PIPELINE STATUS: SUCESSO - Deploy e scans concluidos para voce-aluga"
          else
            echo "PIPELINE STATUS: FALHA - Verifique os jobs anteriores"
            exit 1
          fi
